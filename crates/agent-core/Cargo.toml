[package]
name = "agent-core"
version = "0.2.0"
edition = "2021"
description = "共享数据层：产物/会话/任务索引、线协议、同步管线。中心与远端代理共用同一份实现。"
license = "MIT"
repository = "https://github.com/your-username/agentry"
homepage = "https://github.com/your-username/agentry"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HMAC-SHA256 挑战应答（中心 hub + 代理 agent 双向认证）。sha2 提供 Sha256 / Digest。
sha2 = "0.10"
