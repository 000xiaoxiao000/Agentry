[package]
name = "agentry-proxy"
version = "0.2.0"
edition = "2021"
description = "远端代理 agent：装在远端机器上，主动连回中心 agentry，上报本机工具状态并按需提供数据。"
license = "MIT"
repository = "https://github.com/your-username/agentry"
homepage = "https://github.com/your-username/agentry"
# 同上：显式声明默认二进制，`cargo run` 直接跑它。
default-run = "agentry-proxy"

[dependencies]
agent-core = { path = "../../crates/agent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
